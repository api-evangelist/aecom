description: >-
  AECOM publishes no plans, tiers or prices of any kind. Searched on 2026-08-30:
  the Digital AECOM products index (https://digital.aecom.com/products/, HTTP 200)
  and each product page — pipe.insights, plan.engage, eco.uplift
  (https://digital.aecom.com/product/pipeinsights/, HTTP 200) — carry no pricing,
  no tier table, no "plans" section and no sign-up. Every product routes to a
  contact form. AECOM is a professional-services firm: its digital products are
  sold inside consulting engagements and priced per contract, and the former
  Microsoft Azure Marketplace transactable listing for PipeInsights now returns
  404. Recorded as plan_count 0 rather than omitted, because an absence of
  published pricing is the measurement.
notes: >-
  Supersedes the 2026-05-04 bulk-sweep version of this file, which asserted a
  synthetic "Consulting Engagement" plan that AECOM does not publish. Replaced
  with the probed zero. No self-service pricing exists to record.
