      inspection analysis. It enables municipalities and utilities to upload sewer
      inspection footage, perform QA/QC defect coding, automate defect detection
      using machine learning, visualize infrastructure health, and generate
      rehabilitation strategy recommendations. Available on the Microsoft Azure
      Marketplace.
